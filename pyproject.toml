[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mizban-backend"
version = "0.1.0"
description = "Miz Ban - two-sided 360-degree visual table-reservation platform (Django + Django Ninja backend)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
testpaths = ["apps"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["apps", "core"]
branch = false
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "config/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
