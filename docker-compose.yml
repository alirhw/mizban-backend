# Local development stack (Task T-002): PostgreSQL 18, Redis 8, Django (gunicorn).
services:
  db:
    image: postgres:18
    ports:
      - "5433:5432"
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: ${POSTGRES_DB:-mizban}
      POSTGRES_USER: ${POSTGRES_USER:-mizban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mizban}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mizban} -d ${POSTGRES_DB:-mizban}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    profiles: ["web"]
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: dev-only-secret-key
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://${POSTGRES_USER:-mizban}:${POSTGRES_PASSWORD:-mizban}@db:5432/${POSTGRES_DB:-mizban}
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
